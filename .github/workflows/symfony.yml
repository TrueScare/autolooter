# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Symfony

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  symfony-tests:
    runs-on: ubuntu-latest
    services:
      database:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    #  To automatically get bug fixes and new Php versions for shivammathur/setup-php,
    # change this to (see https://github.com/shivammathur/setup-php#bookmark-versioning):
    # uses: shivammathur/setup-php@v2
    - uses: shivammathur/setup-php@2cb9b829437ee246e9b3cac53555a39208ca6d28
      with:
        php-version: '8.2'
        extensions: mbstring, xml, intl, pdo_mysql
        coverage: none

    - uses: actions/checkout@v4
    - name: Copy .env.test.local
      run: php -r "file_exists('.env.test.local') || copy('.env.test', '.env.test.local');"

    - name: Validate composer.json and composer.lock
      run: composer validate

    - name: Install Dependencies
      uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
      with:
        composer-options: "-q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist"

    - name: Database Schema Setup
      run: |
        php bin/console doctrine:database:create --env=test
        php bin/console doctrine:migrations:migrate --env=test --no-interaction

    - name: Check if migrations are up to date
      run: php bin/console doctrine:schema:validate --env=test --skip-sync

    - name: Execute tests (Unit and Feature tests) via PHPUnit
      run: vendor/bin/phpunit